<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8f5df"><title>BÉ VẬN ĐỘNG VUI KHỎE</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Arial',sans-serif;background:linear-gradient(150deg,#c5f4ff,#e4ffe4 55%,#fff1b5);color:#16434c;min-height:100vh}.app{max-width:1040px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:2px solid #fff;background:#ffffffc9;border-radius:40px;padding:10px 16px;box-shadow:0 5px 14px #16727b22;font-weight:800}.hero{text-align:center;background:linear-gradient(160deg,#ffffffdf,#d7f7edc9);border:4px solid white;border-radius:35px;margin:14px 0;padding:18px 12px;box-shadow:0 15px 35px #367b8033}h1{margin:4px;font-size:clamp(24px,4vw,43px);color:#0d8b73;text-shadow:0 3px white}.subtitle{font-size:clamp(15px,2vw,20px);font-weight:650}.scene{position:relative;min-height:200px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px;background:linear-gradient(#a4e8ff 0 57%,#9be2a3 57% 100%);border-radius:26px;border:4px solid #fff;overflow:hidden}.figure{font-size:clamp(52px,10vw,110px);filter:drop-shadow(0 12px 4px #24502d40);animation:bob 2.5s ease-in-out infinite}.figure:nth-child(2){animation-delay:.5s}.figure:nth-child(3){animation-delay:1s}@keyframes bob{50%{transform:translateY(-9px) rotate(3deg)}}.panel{background:#ffffffed;border:3px solid white;border-radius:26px;padding:18px;margin-top:15px;box-shadow:0 8px 22px #307d7930;text-align:center}.question{font-size:clamp(21px,3vw,30px);font-weight:850;margin:8px 0 14px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}button{cursor:pointer;border:0;border-bottom:5px solid #177e67;border-radius:18px;background:linear-gradient(#63edb5,#20b987);color:#063d34;padding:14px 22px;font-size:clamp(16px,2.5vw,22px);font-weight:850;min-height:55px;box-shadow:0 6px 12px #276e5d33}button:active{transform:translateY(3px);border-bottom-width:2px}button:focus-visible{outline:4px solid #ffb900}.alt{background:linear-gradient(#ffed94,#ffba45);border-color:#c98d27}.blue{background:linear-gradient(#a3e8ff,#59bbff);border-color:#3286bd}.red{background:linear-gradient(#ffcbca,#ff898c);border-color:#c04e54}.message{font-size:20px;font-weight:800;min-height:35px;padding:7px}.foot{text-align:center;font-size:13px;padding:14px;color:#426765}.hidden{display:none!important}.stars{color:#d28a05}.spark{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.07)}}@media(max-width:500px){.app{padding:9px}.hero{padding:12px 8px}.scene{min-height:160px}.panel{padding:12px}.choices button{flex:1 1 40%}}</style></head><body><main class="app"><div class="top"><div class="pill">🌱 MẦM XANH AI</div><div class="pill" id="progress">Nhiệm vụ 1/5</div><div class="pill stars" id="stars">⭐ 0</div></div><section class="hero"><h1>BÉ VẬN ĐỘNG VUI KHỎE</h1><div class="subtitle">5 thử thách thể dục vui nhộn • Dành cho bé 5–6 tuổi</div></section><section class="scene" id="scene" aria-label="Hình minh họa trò chơi"><span class="figure">🏃‍♀️</span><span class="figure">🤸</span><span class="figure">🏃‍♂️</span></section><section class="panel"><div class="question" id="question"></div><div id="detail" class="subtitle"></div><div class="choices" id="choices"></div><div id="message" class="message" role="status" aria-live="polite"></div><div class="choices"><button class="blue" onclick="speakCurrent()">🔊 Nghe hướng dẫn</button><button class="alt" onclick="restart()">↻ Chơi lại</button></div></section><div class="foot">Trẻ vận động có người lớn quan sát • Âm thanh hoạt động sau khi chạm nút</div></main><script>const tasks=[{icon:'🙆‍♀️ 🧒 🙆‍♂️',title:'Giơ hai tay lên cao!',en:'Raise your arms up high!',seconds:8,tip:'Đứng vững, giơ hai tay lên cao rồi hạ xuống nhẹ nhàng.'},{icon:'🐰 🧒 🐰',title:'Bật nhảy như thỏ!',en:'Jump like a bunny!',seconds:10,tip:'Bật nhảy nhẹ tại chỗ, tiếp đất bằng cả bàn chân.'},{icon:'🦩 🧒 🦩',title:'Giữ thăng bằng!',en:'Balance on one foot!',seconds:8,tip:'Đứng một chân, dang tay; có thể vịn ghế chắc chắn.'},{icon:'🌳 🙋 🌳',title:'Vươn vai như cây cao!',en:'Stretch up like a tall tree!',seconds:8,tip:'Vươn hai tay lên, nghiêng người nhẹ sang hai bên.'},{icon:'🎶 💃 🕺 🎶',title:'Nhảy theo nhịp!',en:'Dance to the beat!',seconds:12,tip:'Nhún gối và bước sang trái, sang phải theo nhịp.'}];let level=0,score=0,timer=null,remaining=0,started=false;const $=id=>document.getElementById(id);function say(t,lang='vi-VN'){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}function beep(freq=660){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.22)}catch(e){}}function speakCurrent(){if(level<tasks.length)say(tasks[level].en,'en-US')}function render(){clearInterval(timer);started=false;if(level>=tasks.length){$('progress').textContent='Hoàn thành!';$('scene').innerHTML='<span class="figure">🏆</span><span class="figure">🎉</span><span class="figure">🌟</span>';$('question').textContent='Bé là nhà vô địch vận động!';$('detail').textContent='Con đã hoàn thành 5 thử thách. Hãy uống nước và nghỉ ngơi nhé!';$('choices').innerHTML='<button onclick="restart()">🎮 Chơi lại từ đầu</button>';$('message').textContent='⭐ Tổng cộng '+score+' ngôi sao!';say('Amazing! Well done!','en-US');return}let t=tasks[level];$('progress').textContent='Nhiệm vụ '+(level+1)+'/5';$('stars').textContent='⭐ '+score;$('scene').innerHTML=t.icon.split(' ').map(x=>'<span class="figure">'+x+'</span>').join('');$('question').textContent=t.title;$('detail').textContent=t.tip;$('message').textContent='';$('choices').innerHTML='<button onclick="startMove()">▶ Bắt đầu vận động</button>'}function startMove(){if(started)return;started=true;remaining=tasks[level].seconds;speakCurrent();$('choices').innerHTML='<button class="alt" disabled id="countdown">⏱ '+remaining+' giây</button>';timer=setInterval(()=>{remaining--;beep(remaining%2?440:520);$('countdown').textContent='⏱ '+remaining+' giây';if(remaining<=0){clearInterval(timer);beep(880);$('message').textContent='🎉 Tuyệt vời! Bé đã cố gắng!';$('choices').innerHTML='<button onclick="complete()">⭐ Con đã làm xong!</button><button class="blue" onclick="startAgain()">🔁 Thử lại</button>'}},1000)}function startAgain(){started=false;startMove()}function complete(){score++;level++;render()}function restart(){clearInterval(timer);level=0;score=0;render()}render();</script></body></html>
